# ~/.config/tmux/tmux.conf
# Prefix is Ctrl-a (press it twice to send a literal Ctrl-a to the shell).
# After editing: prefix + r to reload.

# ---------------------------------------------------------------- core
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g extended-keys on                 # pass Shift+Enter etc. through to apps
set -as terminal-features ",xterm*:extkeys"
set -g allow-passthrough on             # lets apps send notifications/images through tmux
set -g set-clipboard on                 # OSC 52 clipboard -> macOS clipboard
set -g focus-events on                  # Neovim reloads files Claude changed when you focus it
set -sg escape-time 10                  # snappy Esc in Neovim
set -g history-limit 100000
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

# A window whose agent rings the bell (Claude waiting for you) gets flagged.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# ---------------------------------------------------------------- keys
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl-h/j/k/l move between panes (vim-tmux-navigator, see plugins), so the
# shell never sees them. Prefix + Ctrl-l / Ctrl-k sends the original key.
bind C-l send-keys 'C-l'   # clear screen
bind C-k send-keys 'C-k'   # kill to end of line

# Agent workflow
bind C split-window -h -l 40% -c "#{pane_current_path}" "claude; exec zsh"   # Claude beside current pane
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit        # review changes
bind f display-popup -E -w 70% -h 60% "tms"                                     # fuzzy-jump to a project session
bind W command-prompt -p "worktree branch:" "run-shell -b 'cd #{pane_current_path} && wt %%'"  # new worktree + agent window

# Vi-style copy mode: prefix + [ , then v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------- look
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[bg=default] "
set -g status-right "#[fg=#a6adc8]%a %H:%M "
setw -g window-status-format "#[fg=#6c7086] #I:#W#{?window_bell_flag, 🔔,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"

# ---------------------------------------------------------------- plugins (TPM)
# prefix + I installs, prefix + U updates. install.sh bootstraps these.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across tmux panes AND nvim splits
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save/restore sessions (prefix + Ctrl-s / Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-continuum'      # ...automatically, every 15 min
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'
