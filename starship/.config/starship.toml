# ~/.config/starship.toml — https://starship.rs/config/
add_newline = true
command_timeout = 800

format = """
$directory$git_branch$git_state$git_status$nodejs$python$golang$rust$cmd_duration
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[nodejs]
format = "[$symbol$version]($style) "

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[golang]
format = "[$symbol$version]($style) "

[rust]
format = "[$symbol$version]($style) "
